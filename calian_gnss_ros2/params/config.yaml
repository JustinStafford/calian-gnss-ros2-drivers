# ---------------------------------------------------------------
# Calian GNSS ROS 2 — antenna configuration (mower)
# ---------------------------------------------------------------
# Each key under ``calian_gnss`` is a node name used by a launch file.
#
# Device binding:
#   Receivers are bound by a STABLE by-id symlink (device:) provisioned by the
#   ansible serial_aliases udev rule — NOT by the vendor's UBX unique_id scan,
#   which only matches the Calian-supplied CP210x bridge and never a generic
#   FTDI (its port description lacks the "Standard" substring the scan filters
#   on).  The `device` param (added in our fork) makes the driver bind directly.
#
#   unique_id is OPTIONAL: when set it is only a non-fatal post-connect sanity
#   check (warns if the receiver on this port reports a different SEC-UNIQID).
#
# Roles:
#   front antenna (/dev/gnss_front) = moving base = official position, gets NTRIP
#   rear  antenna (/dev/gnss_rear)  = rover, publishes /gps + heading /gps_extended
# ---------------------------------------------------------------

calian_gnss:
  # Single-antenna (Disabled) config: disabled.launch.py
  gps_publisher:
    ros__parameters:
      device: "/dev/gnss_front"
      baud_rate: 230400
      use_corrections: False
      frame_id: "gnss_front"
      unique_id: ""   # optional; left blank — identity is pinned by the device by-id alias

  # Moving-baseline BASE (front): moving_baseline.launch.py
  base:
    ros__parameters:
      device: "/dev/gnss_front"
      baud_rate: 230400
      use_corrections: True
      frame_id: "gnss_front"
      unique_id: ""   # optional; left blank — identity is pinned by the device by-id alias

  # Moving-baseline ROVER (rear): moving_baseline.launch.py
  rover:
    ros__parameters:
      device: "/dev/gnss_rear"
      baud_rate: 230400
      use_corrections: False
      frame_id: "gnss_rear"
      unique_id: ""   # optional; left blank — identity is pinned by the device by-id alias
